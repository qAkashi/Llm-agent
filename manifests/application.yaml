apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: practice1-app
spec:
  storageClassName: practice1-local
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-data
  namespace: practice1-app
spec:
  storageClassName: practice1-local
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: practice1-app
  labels:
    app: postgres
  annotations:
    backup.velero.io/backup-volumes: backup-data
    pre.hook.backup.velero.io/container: postgres
    pre.hook.backup.velero.io/command: '["/bin/bash", "/scripts/backup.sh"]'
    pre.hook.backup.velero.io/on-error: Fail
    pre.hook.backup.velero.io/timeout: 5m
    post.hook.backup.velero.io/container: postgres
    post.hook.backup.velero.io/command: '["/bin/bash", "-c", "rmdir /backup/.dump-lock"]'
    post.hook.backup.velero.io/on-error: Fail
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 60
  initContainers:
    - name: backup-permissions
      image: ${postgres}
      command: [bash, -c, 'chown 999:999 /backup']
      volumeMounts:
        - {name: backup-data, mountPath: /backup}
  containers:
    - name: postgres
      image: ${postgres}
      env:
        - {name: POSTGRES_DB, value: app}
        - {name: POSTGRES_USER, value: postgres}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: postgres-auth, key: password}
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef: {name: postgres-auth, key: app-password}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
      ports:
        - {name: postgres, containerPort: 5432}
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: '1', memory: 512Mi}
      readinessProbe:
        exec: {command: [pg_isready, -h, '127.0.0.1', -U, postgres, -d, app]}
        initialDelaySeconds: 5
        periodSeconds: 5
      volumeMounts:
        - {name: pgdata, mountPath: /var/lib/postgresql/data}
        - {name: backup-data, mountPath: /backup}
        - {name: scripts, mountPath: /scripts, readOnly: true}
        - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
  volumes:
    - name: pgdata
      persistentVolumeClaim: {claimName: pgdata}
    - name: backup-data
      persistentVolumeClaim: {claimName: backup-data}
    - name: scripts
      configMap: {name: database-scripts, defaultMode: 365}
    - name: init
      configMap:
        name: database-scripts
        defaultMode: 365
        items:
          - {key: restore.sh, path: 10-restore.sh}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: practice1-app}
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: practice1-app}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-postgres
          image: ${postgres}
          command: [bash, -ec, 'until pg_isready -h postgres -U postgres -d app; do sleep 2; done']
      containers:
        - name: api
          image: ${postgrest}
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef: {name: api-auth, key: uri}
            - {name: PGRST_DB_ANON_ROLE, value: reader}
            - {name: PGRST_DB_SCHEMAS, value: public}
            - {name: PGRST_DB_CHANNEL_ENABLED, value: 'false'}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: practice1-app}
spec:
  selector: {app: api}
  ports:
    - {port: 3000, targetPort: http}
