apiVersion: v1
kind: ConfigMap
metadata:
  name: practice1-restore-modifiers
  namespace: velero
data:
  modifiers.yaml: |
    version: v1
    resourceModifierRules:
      - conditions:
          groupResource: persistentvolumeclaims
          namespaces: [practice1-app]
        mergePatches:
          - patchData: |
              {
                "spec": {"volumeName": null},
                "metadata": {
                  "annotations": {
                    "pv.kubernetes.io/bind-completed": null,
                    "pv.kubernetes.io/bound-by-controller": null,
                    "volume.kubernetes.io/selected-node": null
                  }
                }
              }
